<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSS Ops Command Center</title>

  <!-- React (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #f7f8fb;
      color: #0f172a;
    }

    a {
      color: inherit;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kpi {
      flex: 1 1 240px;
    }

    .kpi h3 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .kpi .v {
      font-size: 26px;
      font-weight: 800;
    }

    .kpi .s {
      margin-top: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid rgba(55, 48, 163, .18);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      cursor: pointer;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, .12);
      background: white;
    }

    .tab.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 10px 10px;
      border-bottom: 1px solid rgba(15, 23, 42, .08);
      font-size: 13px;
      vertical-align: top;
    }

    th {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, .12);
      display: inline-block;
      background: #fff;
    }

    .pill.pipeline {
      background: #f1f5f9;
    }

    .pill.setup {
      background: #fff7ed;
      border-color: rgba(234, 88, 12, .25);
    }

    .pill.in_progress {
      background: #ecfeff;
      border-color: rgba(6, 182, 212, .25);
    }

    .pill.delivered {
      background: #f0fdf4;
      border-color: rgba(34, 197, 94, .25);
    }

    .pill.closed {
      background: #fef2f2;
      border-color: rgba(239, 68, 68, .25);
    }

    .btn {
      cursor: pointer;
      border: 1px solid rgba(15, 23, 42, .14);
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .btn.primary {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    .btn.danger {
      background: #fee2e2;
      border-color: rgba(239, 68, 68, .25);
      color: #991b1b;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, .18);
      font-size: 14px;
    }

    .muted {
      color: #64748b;
      font-size: 12px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }

    .right {
      text-align: right;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 900px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #0f172a;
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, .25);
      max-width: 420px;
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal {
      width: min(560px, 100%);
    }

    .split {
      display: flex;
      gap: 12px;
    }

    .split>div {
      flex: 1;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // ------------------------------------------------------------------
    // 1) CONFIG (static HTML friendly)
    // ------------------------------------------------------------------
    // For Vercel static sites, there is no build step to inject env vars.
    // Easiest: hardcode defaults here (anon key is safe for frontend),
    // and allow override via localStorage.
    const DEFAULT_SUPABASE_URL = "https://bdwmqyctjedrveltohnq.supabase.co";
    const DEFAULT_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkd21xeWN0amVkcnZlbHRvaG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDk4MzgsImV4cCI6MjA4NzY4NTgzOH0.IgeJrIJ4wWbLnh6j9JZ_SWh95kAa42K5VqvOHGU2Lig"; // <-- replace once in git

    const CONFIG_KEY = "mss_ops_config_v1";

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return {
        url: DEFAULT_SUPABASE_URL,
        anonKey: DEFAULT_SUPABASE_ANON_KEY,
        slackHandoffFn: "slack-channel-handoff",
      };
    }

    function saveConfig(cfg) {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    }

    function createSb(cfg) {
      const { createClient } = window.supabase;
      return createClient(cfg.url, cfg.anonKey);
    }

    function money(n, currency = "AUD") {
      try {
        return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(Number(n || 0));
      } catch (e) {
        return "$" + (Number(n || 0).toFixed(2));
      }
    }

    function daysBetween(a, b) {
      if (!a || !b) return null;
      const d1 = new Date(a);
      const d2 = new Date(b);
      const ms = d2 - d1;
      if (Number.isNaN(ms)) return null;
      return Math.round(ms / (1000 * 60 * 60 * 24));
    }

    // ------------------------------------------------------------------
    // 2) UI: Config Modal (only if missing keys)
    // ------------------------------------------------------------------
    function ConfigModal({ initial, onSave }) {
      const [url, setUrl] = useState(initial.url || "");
      const [anonKey, setAnonKey] = useState(initial.anonKey || "");
      const [slackHandoffFn, setSlackHandoffFn] = useState(initial.slackHandoffFn || "slack-channel-handoff");

      const invalid = !url || !anonKey || anonKey.includes("PASTE_ANON_KEY_HERE");

      return (
        <div className="modal-back">
          <div className="card modal">
            <div className="topbar">
              <div className="brand">
                <div style={{ fontWeight: 900, fontSize: 16 }}>MSS Ops Command Center</div>
                <span className="badge">Config</span>
              </div>
            </div>
            <p className="muted" style={{ marginTop: 0 }}>
              This dashboard is a static HTML app. Add your Supabase URL + anon key once; we store it in your browser (localStorage).
              The anon key is safe for frontend because Row Level Security protects your data.
            </p>

            <div style={{ display: "grid", gap: 10 }}>
              <div>
                <div className="muted">Supabase URL</div>
                <input className="input" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://xxxx.supabase.co" />
              </div>
              <div>
                <div className="muted">Supabase anon public key</div>
                <input className="input mono" value={anonKey} onChange={(e) => setAnonKey(e.target.value)} placeholder="eyJhbGciOi..." />
              </div>
              <div>
                <div className="muted">Slack handoff Edge Function name</div>
                <input className="input" value={slackHandoffFn} onChange={(e) => setSlackHandoffFn(e.target.value)} placeholder="slack-channel-handoff" />
              </div>
              <div className="row" style={{ justifyContent: "flex-end" }}>
                <button className="btn primary" disabled={invalid} onClick={() => onSave({ url, anonKey, slackHandoffFn })}>
                  Save & Continue
                </button>
              </div>
              {invalid && <div className="muted">Paste valid values to continue.</div>}
            </div>
          </div>
        </div>
      );
    }

    // ------------------------------------------------------------------
    // 3) Auth screen
    // ------------------------------------------------------------------
    function AuthScreen({ onLogin, sb }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      async function signIn() {
        setErr("");
        setLoading(true);
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (error) return setErr(error.message);
        onLogin(data.session);
      }

      return (
        <div className="wrap" style={{ paddingTop: 54 }}>
          <div className="card" style={{ maxWidth: 520, margin: "0 auto" }}>
            <div style={{ fontWeight: 900, fontSize: 18 }}>Sign in</div>
            <div className="muted" style={{ marginTop: 6 }}>
              Use the Supabase Auth user you created (e.g., Nick).
            </div>

            <div style={{ display: "grid", gap: 10, marginTop: 14 }}>
              <div>
                <div className="muted">Email</div>
                <input className="input" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nick@..." />
              </div>
              <div>
                <div className="muted">Password</div>
                <input className="input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />
              </div>
              {err && <div className="pill" style={{ borderColor: "rgba(239,68,68,.35)", background: "#fef2f2", color: "#991b1b" }}>{err}</div>}
              <button className={"btn primary"} onClick={signIn} disabled={loading || !email || !password}>
                {loading ? "Signing in..." : "Sign in"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ------------------------------------------------------------------
    // 4) Main Dashboard
    // ------------------------------------------------------------------
    function Dashboard({ sb, cfg, me, role, onLogout, toast }) {
      const [tab, setTab] = useState("projects");

      const [projects, setProjects] = useState([]);
      const [capacity, setCapacity] = useState([]);
      const [activity, setActivity] = useState([]);
      const [loading, setLoading] = useState(true);

      // ---- fetchers
      async function loadAll() {
        setLoading(true);

        // Projects (admin can see all; team will be row-filtered by RLS)
        const projSelect = role === "admin"
          ? "id,name,client,brand,tcv,nick_percentage,status,assigned_team_name,kickoff_date,delivery_date,lld_progress,slack_channel,drive_folder,sow_link,gantt_link,hld_link,lld_link,xlsx_tracker_link,html_hld_link,notes,integration_notes,upfront_invoiced,upfront_paid,delivery_invoiced,delivery_paid,signed_date"
          : "id,name,client,brand,status,assigned_team_name,kickoff_date,delivery_date,lld_progress,slack_channel,drive_folder,sow_link,gantt_link,hld_link,lld_link,xlsx_tracker_link,html_hld_link,notes,integration_notes";

        const { data: pData, error: pErr } = await sb
          .from("projects")
          .select(projSelect)
          .order("id", { ascending: false });

        if (pErr) toast("Failed to load projects: " + pErr.message, true);
        setProjects(pData || []);

        // Capacity (admin useful)
        if (role === "admin") {
          const { data: cData, error: cErr } = await sb
            .from("capacity_overview")
            .select("*")
            .order("utilization_pct", { ascending: false });

          if (cErr) toast("Failed to load capacity: " + cErr.message, true);
          setCapacity(cData || []);
        }

        // Activity (admin useful)
        const { data: aData, error: aErr } = await sb
          .from("activity_log")
          .select("id,project_id,actor,action,old_value,new_value,details,created_at")
          .order("created_at", { ascending: false })
          .limit(60);

        if (aErr) toast("Failed to load activity: " + aErr.message, true);
        setActivity(aData || []);

        setLoading(false);
      }

      useEffect(() => {
        loadAll();

        // Realtime: listen to project updates and refresh small
        const channel = sb
          .channel("mss-ops-projects")
          .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, (payload) => {
            // light refresh
            loadAll();
          })
          .subscribe();

        return () => { sb.removeChannel(channel); };
      }, []);

      // ---- derived KPIs (admin only)
      const revenue = useMemo(() => {
        if (role !== "admin") return null;
        const rows = projects || [];
        let tcv = 0, nickCut = 0, collected = 0, outstanding = 0;
        rows.forEach(p => {
          const pct = Number(p.nick_percentage || 0.25);
          const nc = Number(p.tcv || 0) * pct;
          tcv += Number(p.tcv || 0);
          nickCut += nc;

          const upfront = nc * 0.5;
          const delivery = nc * 0.5;
          const c = (p.upfront_paid ? upfront : 0) + (p.delivery_paid ? delivery : 0);
          collected += c;
          outstanding += (nc - c);
        });
        return { tcv, nickCut, collected, outstanding };
      }, [projects, role]);

      const activeProjectsCount = useMemo(() => {
        if (role !== "admin") return 0;
        return (projects || []).filter(p => ["setup", "in_progress"].includes(p.status)).length;
      }, [projects, role]);

      const capacitySummary = useMemo(() => {
        if (role !== "admin") return null;
        const rows = capacity || [];
        if (!rows.length) return { totalSlots: 0, active: 0, available: 0, utilizationPct: 0 };

        const totalSlots = rows.reduce((sum, r) => sum + (Number(r.max_projects) || 0), 0);
        const active = rows.reduce((sum, r) => sum + (Number(r.active_projects) || 0), 0);
        const available = rows.reduce((sum, r) => sum + (Number(r.available_slots) || 0), 0);

        const utilizationPct = totalSlots > 0 ? Math.round((active / totalSlots) * 100) : 0;

        return { totalSlots, active, available, utilizationPct };
      }, [capacity, role]);

      // ----------------------------------------------------------------
      // Actions
      // ----------------------------------------------------------------
      async function updateProject(id, patch) {
        const { error } = await sb.from("projects").update(patch).eq("id", id);
        if (error) {
          toast("Update failed: " + error.message, true);
          return false;
        }
        return true;
      }

      async function handleStatusChange(project, newStatus) {
        const oldStatus = project.status;
        if (oldStatus === newStatus) return;

        // 1) Update DB status
        const ok = await updateProject(project.id, { status: newStatus });
        if (!ok) return;
        toast(`Status updated: ${project.client} → ${newStatus}`);

        // 2) If moved into in_progress: auto-create Slack channel + post handoff + write channel_id
        if (newStatus === "in_progress" && oldStatus !== "in_progress") {
          try {
            toast("Creating Slack channel + posting handoff...");
            const res = await fetch(`${cfg.url}/functions/v1/${cfg.slackHandoffFn}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${cfg.anonKey}`,
              },
              body: JSON.stringify({ project_id: project.id })
            });
            const out = await res.json();
            if (!out.ok && out.error) {
              toast("Slack handoff failed: " + out.error, true);
            } else {
              toast("Slack handoff done ✅");
              // refresh
              loadAll();
            }
          } catch (e) {
            toast("Slack handoff failed: " + (e?.message || "unknown"), true);
          }
        }
      }

      async function handleProgressChange(project, newVal) {
        const n = Math.max(0, Math.min(100, Number(newVal)));
        await updateProject(project.id, { lld_progress: n });
      }

      function slackLink(channelIdOrName) {
        if (!channelIdOrName) return null;
        // If you store channel IDs (C...), app_redirect works well:
        if (channelIdOrName.startsWith("C")) {
          return `https://slack.com/app_redirect?channel=${channelIdOrName}`;
        }
        // otherwise just show raw
        return null;
      }

      // ----------------------------------------------------------------
      // UI
      // ----------------------------------------------------------------
      return (
        <div className="wrap">
          <div className="topbar">
            <div className="brand">
              <div style={{ fontWeight: 900, fontSize: 18 }}>MSS Ops Command Center</div>
              <span className="badge">{role === "admin" ? "Admin" : "Team"}</span>
              <span className="pill mono">{me?.email}</span>
            </div>
            <div className="row" style={{ justifyContent: "flex-end" }}>
              <button className="btn" onClick={loadAll}>Refresh</button>
              <button className="btn danger" onClick={onLogout}>Logout</button>
            </div>
          </div>

          {role === "admin" && revenue && (
            <div className="row" style={{ marginBottom: 12 }}>
              <div className="card kpi">
                <h3>Total TCV</h3>
                <div className="v">{money(revenue.tcv, "AUD")}</div>
                <div className="s">All projects in system</div>
              </div>
              <div className="card kpi">
                <h3>Nick Cut</h3>
                <div className="v">{money(revenue.nickCut, "AUD")}</div>
                <div className="s">TCV × nick_percentage</div>
              </div>
              <div className="card kpi">
                <h3>Collected</h3>
                <div className="v">{money(revenue.collected, "AUD")}</div>
                <div className="s">Paid (upfront + delivery)</div>
              </div>
              <div className="card kpi">
                <h3>Outstanding</h3>
                <div className="v">{money(revenue.outstanding, "AUD")}</div>
                <div className="s">Not yet paid</div>
              </div>
              <div className="card kpi">
                <h3>Active Projects</h3>
                <div className="v">{activeProjectsCount}</div>
                <div className="s">Setup + In Progress</div>
              </div>

              <div className="card kpi">
                <h3>Capacity Utilization</h3>
                <div className="v">{capacitySummary ? `${capacitySummary.utilizationPct}%` : "—"}</div>
                <div className="s">
                  {capacitySummary
                    ? `${capacitySummary.active}/${capacitySummary.totalSlots} slots used • ${capacitySummary.available} available`
                    : "Loading..."}
                </div>
              </div>
            </div>
          )}

          <div className="tabs" style={{ marginBottom: 12 }}>
            <div className={"tab " + (tab === "projects" ? "active" : "")} onClick={() => setTab("projects")}>Projects</div>
            {role === "admin" && <div className={"tab " + (tab === "capacity" ? "active" : "")} onClick={() => setTab("capacity")}>Capacity</div>}
            <div className={"tab " + (tab === "activity" ? "active" : "")} onClick={() => setTab("activity")}>Activity Log</div>
            <div className={"tab " + (tab === "settings" ? "active" : "")} onClick={() => setTab("settings")}>Settings</div>
          </div>

          {loading && <div className="card">Loading…</div>}

          {!loading && tab === "projects" && (
            <div className="card">
              <div className="topbar">
                <div>
                  <div style={{ fontWeight: 900 }}>Projects</div>
                  <div className="muted">Change status to <span className="mono">in_progress</span> to auto-create Slack channel + post handoff.</div>
                </div>
              </div>

              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Client / Project</th>
                      <th>Status</th>
                      <th>Team</th>
                      <th>LLD %</th>
                      {role === "admin" && <th className="right">Nick Cut</th>}
                      <th>Slack</th>
                      <th>Dates</th>
                      <th>Docs</th>
                    </tr>
                  </thead>
                  <tbody>
                    {projects.map(p => {
                      const pct = Number(p.nick_percentage || 0.25);
                      const nickCut = Number(p.tcv || 0) * pct;

                      return (
                        <tr key={p.id}>
                          <td className="mono">{p.id}</td>
                          <td>
                            <div style={{ fontWeight: 800 }}>{p.client}</div>
                            <div className="muted">{p.name}</div>
                          </td>
                          <td>
                            <div style={{ display: "grid", gap: 8 }}>
                              <span className={"pill " + p.status}>{p.status}</span>
                              {role === "admin" ? (
                                <select className="input" style={{ padding: "8px 10px" }} value={p.status}
                                  onChange={(e) => handleStatusChange(p, e.target.value)}>
                                  <option value="pipeline">pipeline</option>
                                  <option value="setup">setup</option>
                                  <option value="in_progress">in_progress</option>
                                  <option value="delivered">delivered</option>
                                  <option value="closed">closed</option>
                                </select>
                              ) : (
                                <div className="muted">—</div>
                              )}
                            </div>
                          </td>
                          <td>{p.assigned_team_name || <span className="muted">Unassigned</span>}</td>
                          <td style={{ minWidth: 160 }}>
                            <div style={{ display: "grid", gap: 8 }}>
                              <div className="mono">{Number(p.lld_progress || 0)}%</div>
                              {role === "admin" ? (
                                <input className="input" type="number" min="0" max="100" value={Number(p.lld_progress || 0)}
                                  onChange={(e) => handleProgressChange(p, e.target.value)} />
                              ) : (
                                <div className="muted">—</div>
                              )}
                            </div>
                          </td>
                          {role === "admin" && <td className="right">{money(nickCut, "AUD")}</td>}
                          <td style={{ minWidth: 150 }}>
                            {p.slack_channel ? (
                              slackLink(p.slack_channel)
                                ? <a className="pill mono" href={slackLink(p.slack_channel)} target="_blank" rel="noreferrer">Open</a>
                                : <span className="pill mono">{p.slack_channel}</span>
                            ) : <span className="muted">—</span>}
                          </td>
                          <td style={{ minWidth: 160 }}>
                            <div className="muted">
                              {p.kickoff_date ? <>Kickoff: <span className="mono">{p.kickoff_date}</span><br /></> : null}
                              {p.delivery_date ? <>Delivery: <span className="mono">{p.delivery_date}</span></> : null}
                            </div>
                          </td>
                          <td style={{ minWidth: 220 }}>
                            <div className="muted" style={{ display: "grid", gap: 6 }}>
                              {p.drive_folder && <a href={p.drive_folder} target="_blank" rel="noreferrer">Drive</a>}
                              {p.hld_link && <a href={p.hld_link} target="_blank" rel="noreferrer">HLD</a>}
                              {p.lld_link && <a href={p.lld_link} target="_blank" rel="noreferrer">LLD</a>}
                              {p.xlsx_tracker_link && <a href={p.xlsx_tracker_link} target="_blank" rel="noreferrer">Tracker</a>}
                              {!p.drive_folder && !p.hld_link && !p.lld_link && !p.xlsx_tracker_link && <span className="muted">—</span>}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                    {projects.length === 0 && (
                      <tr><td colSpan={9} className="muted">No projects found (check RLS / login).</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {!loading && tab === "capacity" && role === "admin" && (
            <div className="card">
              <div className="topbar">
                <div>
                  <div style={{ fontWeight: 900 }}>Capacity</div>
                  <div className="muted">From <span className="mono">capacity_overview</span> view.</div>
                </div>
              </div>

              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th>Team member</th>
                      <th>Role</th>
                      <th className="right">Weekly cost</th>
                      <th className="right">Max projects</th>
                      <th className="right">Active</th>
                      <th className="right">Available</th>
                      <th className="right">Utilization</th>
                      <th>Speed note</th>
                    </tr>
                  </thead>
                  <tbody>
                    {capacity.map(c => (
                      <tr key={c.id}>
                        <td style={{ fontWeight: 800 }}>{c.full_name}</td>
                        <td><span className="pill">{c.role}</span></td>
                        <td className="right">{money(c.weekly_cost || 0, "AUD")}</td>
                        <td className="right mono">{c.max_projects}</td>
                        <td className="right mono">{c.active_projects}</td>
                        <td className="right mono">{c.available_slots}</td>
                        <td className="right mono">{c.utilization_pct ?? 0}%</td>
                        <td className="muted">{c.speed_note || "—"}</td>
                      </tr>
                    ))}
                    {capacity.length === 0 && (
                      <tr><td colSpan={8} className="muted">No capacity rows (check view + RLS).</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {!loading && tab === "activity" && (
            <div className="card">
              <div className="topbar">
                <div>
                  <div style={{ fontWeight: 900 }}>Activity Log</div>
                  <div className="muted">Latest 60 events from <span className="mono">activity_log</span>.</div>
                </div>
              </div>

              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th>Time</th>
                      <th>Project</th>
                      <th>Action</th>
                      <th>Old → New</th>
                      <th>Actor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {activity.map(a => (
                      <tr key={a.id}>
                        <td className="mono">{new Date(a.created_at).toLocaleString()}</td>
                        <td className="mono">#{a.project_id}</td>
                        <td><span className="pill">{a.action}</span></td>
                        <td className="mono">{(a.old_value ?? "—")} → {(a.new_value ?? "—")}</td>
                        <td className="muted">{a.actor || "system"}</td>
                      </tr>
                    ))}
                    {activity.length === 0 && (
                      <tr><td colSpan={5} className="muted">No activity yet.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {!loading && tab === "settings" && (
            <div className="card">
              <div style={{ fontWeight: 900 }}>Settings</div>
              <div className="muted" style={{ marginTop: 6 }}>
                Config is stored in your browser. Use this if you ever change project keys.
              </div>

              <div className="grid2" style={{ marginTop: 12 }}>
                <div>
                  <div className="muted">Supabase URL</div>
                  <div className="pill mono" style={{ display: "block" }}>{cfg.url}</div>
                </div>
                <div>
                  <div className="muted">Slack handoff function</div>
                  <div className="pill mono" style={{ display: "block" }}>{cfg.slackHandoffFn}</div>
                </div>
              </div>

              <div className="row" style={{ marginTop: 12 }}>
                <button className="btn" onClick={() => { localStorage.removeItem(CONFIG_KEY); location.reload(); }}>
                  Reset config
                </button>
              </div>

              <div className="muted" style={{ marginTop: 14 }}>
                <b>Next improvements:</b> add a Work Session timer table (start/stop) to track how long team is actively building each project.
              </div>
            </div>
          )}
        </div>
      );
    }

    // ------------------------------------------------------------------
    // 5) App wrapper
    // ------------------------------------------------------------------
    function App() {
      const [cfg, setCfg] = useState(loadConfig());
      const [sb, setSb] = useState(null);

      const [session, setSession] = useState(null);
      const [me, setMe] = useState(null);
      const [role, setRole] = useState("team");
      const [toastMsg, setToastMsg] = useState(null);
      const [toastErr, setToastErr] = useState(false);

      function toast(msg, isErr = false) {
        setToastMsg(msg);
        setToastErr(isErr);
        setTimeout(() => setToastMsg(null), 3200);
      }

      useEffect(() => {
        // build supabase client
        const next = createSb(cfg);
        setSb(next);

        // session tracking
        next.auth.getSession().then(({ data }) => {
          if (data?.session) setSession(data.session);
        });

        const { data: sub } = next.auth.onAuthStateChange((_event, sess) => {
          setSession(sess);
        });

        return () => { sub?.subscription?.unsubscribe?.(); };
      }, [cfg.url, cfg.anonKey]);

      useEffect(() => {
        if (!sb || !session) return;

        const user = session.user;
        setMe(user);

        // Determine role from team_members table
        (async () => {
          const { data, error } = await sb
            .from("team_members")
            .select("role,full_name")
            .eq("user_id", user.id)
            .maybeSingle();

          if (error) {
            toast("Role lookup failed: " + error.message, true);
            setRole("team");
            return;
          }
          setRole(data?.role || "team");
        })();
      }, [sb, session]);

      async function logout() {
        if (!sb) return;
        await sb.auth.signOut();
        setSession(null);
        setMe(null);
      }

      // If anon key not set, show config modal
      const needsConfig = !cfg.url || !cfg.anonKey || cfg.anonKey.includes("PASTE_ANON_KEY_HERE");

      if (needsConfig) {
        return (
          <ConfigModal
            initial={cfg}
            onSave={(nextCfg) => {
              saveConfig(nextCfg);
              setCfg(nextCfg);
            }}
          />
        );
      }

      if (!sb) return <div className="wrap"><div className="card">Initializing…</div></div>;
      if (!session) return <AuthScreen sb={sb} onLogin={setSession} />;

      return (
        <>
          <Dashboard sb={sb} cfg={cfg} me={me} role={role} onLogout={logout} toast={toast} />
          {toastMsg && (
            <div className="toast" style={{ background: toastErr ? "#991b1b" : "#0f172a" }}>
              {toastMsg}
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
